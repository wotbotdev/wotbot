services:
  wotbot:
    build:
      context: ../apps/wotbot
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ../apps/wotbot/src:/app/src:cached
      - ../apps/wotbot/tests:/app/tests:cached
    environment:
      LOG_LEVEL: "DEBUG"
      PYTHONPATH: "/app/src"
      # External clients follow the Agent Card and artifact URLs through the
      # published host port, rather than Docker's internal service DNS.
      REGISTRY_PUBLIC_URL: "${REGISTRY_PUBLIC_URL:-http://localhost:8123}"
    command: ["wotbot", "serve", "--reload"]

  job-worker:
    build:
      context: ../apps/wotbot
      dockerfile: Dockerfile
    volumes:
      - ../apps/wotbot/src:/app/src:cached
      - ../apps/wotbot/tests:/app/tests:cached
    environment:
      LOG_LEVEL: "DEBUG"
      PYTHONPATH: "/app/src"
    command: ["wotbot", "job-worker"]

  livekit-agent:
    build:
      context: ../apps/wotbot
      dockerfile: Dockerfile
    volumes:
      - ../apps/wotbot/src:/app/src:cached
      - ../apps/wotbot/tests:/app/tests:cached
    environment:
      LOG_LEVEL: "DEBUG"
      PYTHONPATH: "/app/src"
    command: ["wotbot", "livekit-agent", "start"]

  job-scheduler:
    build:
      context: ../apps/wotbot
      dockerfile: Dockerfile
    volumes:
      - ../apps/wotbot/src:/app/src:cached
      - ../apps/wotbot/tests:/app/tests:cached
    environment:
      LOG_LEVEL: "DEBUG"
      PYTHONPATH: "/app/src"
    command: ["wotbot", "job-scheduler"]

  thing-indexer:
    build:
      context: ../apps/wotbot
      dockerfile: Dockerfile
    volumes:
      - ../apps/wotbot/src:/app/src:cached
      - ../apps/wotbot/tests:/app/tests:cached
    environment:
      LOG_LEVEL: "DEBUG"
      PYTHONPATH: "/app/src"
    command: ["wotbot", "thing-indexer"]

  rdf-service:
    build:
      context: ../apps/wotbot
      dockerfile: Dockerfile
    volumes:
      - ../apps/wotbot/src:/app/src:cached
      - ../apps/wotbot/tests:/app/tests:cached
      - rdf-data:/data/rdf
    environment:
      LOG_LEVEL: "DEBUG"
      PYTHONPATH: "/app/src"
      RDF_STORE_PATH: "/data/rdf"
    command: ["wotbot", "rdf-service", "--reload"]

  ui:
    build:
      context: ../apps/ui
      dockerfile: Dockerfile
      target: dev
      args:
        APP_VERSION: ${APP_VERSION:-}
    volumes:
      - ../apps/ui:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_POLL_INTERVAL_MS: "${NEXT_POLL_INTERVAL_MS:-1000}"

  code-executor:
    build:
      context: ../apps/code-executor
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8888:8888"
    volumes:
      - ../apps/code-executor/code_executor:/app/code_executor:cached
    environment:
      LOG_LEVEL: "DEBUG"
      IDLE_TIMEOUT_SECONDS: "600"
    entrypoint: ["uvicorn", "code_executor.api.app:app", "--host", "0.0.0.0", "--port", "8888", "--reload", "--reload-dir", "code_executor"]

  wot-runtime:
    build:
      context: ../apps/wot-runtime
      dockerfile: Dockerfile
      target: deps
    volumes:
      - ../apps/wot-runtime:/app:cached
      - /app/node_modules
    command: ["npx", "tsx", "watch", "src/index.ts"]

  virtual-servient:
    build:
      context: ../apps/virtual-servient
      dockerfile: Dockerfile
      target: deps
    volumes:
      - ../apps/virtual-servient:/app:cached
      - /app/node_modules
    command: ["npx", "tsx", "watch", "src/index.ts"]
