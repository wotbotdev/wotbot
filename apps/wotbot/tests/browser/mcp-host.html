<!doctype html><title>WoTBot MCP Apps acceptance host</title>
<h1>WoTBot MCP Apps acceptance host</h1>
<pre id="log" aria-live="polite">Connecting…</pre>
<iframe id="sandbox" title="MCP Apps sandbox" sandbox="allow-scripts allow-same-origin" style="width:100%;height:500px;border:1px solid #999"></iframe>
<script type="module">
import {AppBridge, PostMessageTransport} from '/host.js';
const log = text => { document.querySelector('#log').textContent += '\n' + text; };
const frame = document.querySelector('#sandbox');
const bridge = new AppBridge(null, {name:'WoTBot acceptance host',version:'1.0.0'}, {serverTools:{},logging:{}},
  {hostContext:{toolInfo:{id:'open-panel',tool:{name:'panel.open.fixture',inputSchema:{type:'object'}}},theme:'light'}});
const binary = {kind:'binary',contentType:'image/png',bodyBase64:'AQI=',sizeBytes:2};
let polls = 0;
// The bridge, not the server, carries each subscription's stream position.
const cursors = new Map();
bridge.oncalltool = async params => {
  if (params.name !== 'panels.call' || params.arguments.grant !== 'fixture-grant') throw Error('Wrong authorization or tool');
  const {tool, arguments:args} = params.arguments;
  log(tool);
  let result;
  if (tool === 'things.read_property') result = binary;
  else if (tool === 'things.write_property') {
    if(args.valueBase64 !== 'AQI=' || args.valueContentType !== 'image/png') throw Error('Binary write was lost');
    result = true;
  } else if (tool === 'things.invoke_action') {
    if(args.inputBase64 !== 'AQI=') throw Error('Binary action input was lost');
    result = binary;
  } else if(tool === 'things.observe_property' || tool === 'things.subscribe_event') result = {subscription_id:tool, cursor:'1-0'};
  else if(tool === 'things.next_subscription_event') {
    const expected = cursors.get(args.subscriptionId) ?? '1-0';
    if (args.cursor !== expected) throw Error('Bridge lost its stream position: '+args.cursor+' != '+expected);
    const next = '1-'+(Number(expected.split('-')[1]) + 1);
    cursors.set(args.subscriptionId, next);
    if (++polls > 2) await new Promise(r=>setTimeout(r,50));
    result = {event:{subscriptionId:args.subscriptionId,value:binary}, nextCursor:next};
  } else if(tool === 'things.unsubscribe') result = {ok:true};
  else throw Error('Unexpected operation: '+tool);
  return {content:[{type:'text',text:JSON.stringify(result)}],structuredContent:{result}};
};
bridge.onerror = error => log('ERROR: '+error.message);
bridge.oninitialized = async () => {
  log('Official AppBridge initialized');
  await bridge.sendToolInput({arguments:{}});
  // Exercise app operations queued before the launch grant arrives.
  setTimeout(()=>bridge.sendToolResult({content:[{type:'text',text:'Opened fixture'}],
    _meta:{'dev.wotbot/panel-launch':{grant:'fixture-grant',callTool:'panels.call'}}}),100);
};
bridge.onsandboxready = async () => {
  const response = await fetch('/panel');
  await bridge.sendSandboxResourceReady({html:await response.text()});
};
await bridge.connect(new PostMessageTransport(frame.contentWindow, frame.contentWindow));
// Separate proxy origin; generated code is inside a second opaque sandbox.
frame.src = 'http://127.0.0.1:8918/proxy';
</script>
