[project]
name = "code-executor"
version = "0.1.1"
description = "exec()-based Python code execution service for WoTBot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.18",
    # Analytics & data
    "pandas>=2.2",
    "numpy>=1.26",
    # Plotting
    "matplotlib>=3.9",
    "plotly>=5.24",
    "seaborn>=0.13",
    # HTTP
    "requests>=2.31",
    "httpx>=0.27",
    # Utilities
    "scipy>=1.14",
    "openpyxl>=3.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Worker response validation uses RuntimeError/ValueError as protocol errors;
# callers should not distinguish type mismatches from other malformed results.
ignore = ["TRY004"]

[tool.ruff.lint.per-file-ignores]
# FastAPI evaluates Security() at import time by design.
"code_executor/api/dependencies.py" = ["B008"]
# Executing submitted code and containing arbitrary user-code failures are the
# purpose of these process boundaries.
"code_executor/execution_environment.py" = ["BLE001", "S102"]
"code_executor/session_pool.py" = ["BLE001", "S110"]
"code_executor/worker.py" = ["BLE001", "S110"]
"code_executor/wot_client.py" = ["BLE001"]
